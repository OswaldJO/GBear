name: GBear
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  GBearSPM:
    path: .

targets:
  GBear:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    entitlements:
      path: GBear/GBear.entitlements
      properties:
        # Do not enable com.apple.security.app-sandbox — it strips emulator launch argv.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    sources:
      - path: GBear
        excludes:
          - "**/*.md"
          - Resources/Sunshine/**
          - "*.entitlements"
    resources:
      - path: GBear/Resources/Sunshine
        buildPhase: resources
        optional: true
        excludes:
          - "**/*.md"
    dependencies:
      - package: GBearSPM
        product: GBearKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.funnybearapps.gbear
        PRODUCT_NAME: GBear
        DEVELOPMENT_TEAM: AFYV687T82
        CODE_SIGN_ENTITLEMENTS: GBear/GBear.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GBear
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: GBear finds and controls your Roku TV's volume, and streams games to phones and computers on your network.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: GBear streams your desktop to your phone using an embedded streaming host.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
